name: Release — Installer & Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  SOLUTION: Cine.sln
  APP_PROJECT: src/App/App.csproj
  TEST_PROJECT: tests/Cine.Tests/Cine.Tests.csproj
  DOTNET_VERSION: '10.0.x'
  MSIX_NAME: Cine.CineMediaPlayer
  CONFIG: Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ── Setup ──────────────────────────────────────────
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup WiX
      run: dotnet tool install --global wix

    # ── Restore & Build ────────────────────────────────
    - name: Restore
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Build
      run: >
        dotnet build ${{ env.SOLUTION }}
        --configuration ${{ env.CONFIG }}
        --no-restore
        -p:Platform=${{ matrix.arch }}

    # ── Test ───────────────────────────────────────────
    - name: Test
      run: >
        dotnet test ${{ env.TEST_PROJECT }}
        --configuration ${{ env.CONFIG }}
        --no-build
        --logger "trx;LogFileName=test-results-${{ matrix.arch }}.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.arch }}
        path: '**/*.trx'

    # ── Version from tag ───────────────────────────────
    - name: Set version
      id: version
      run: |
        $tag = '${{ github.ref_name }}' -replace '^v', ''
        echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    # ── Publish (framework-dependent) ──────────────────
    - name: Publish
      run: >
        dotnet publish ${{ env.APP_PROJECT }}
        --configuration ${{ env.CONFIG }}
        --runtime win-${{ matrix.arch }}
        --self-contained false
        -p:PublishSingleFile=false
        -p:Version=${{ steps.version.outputs.VERSION }}
        -o publish/win-${{ matrix.arch }}

    # ── Import signing certificate ─────────────────────
    - name: Import signing cert
      id: sign
      env:
        PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
        PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      run: |
        if (-not $env:PFX_BASE64) {
          Write-Host "No signing cert secret found — skipping signing"
          echo "SKIP_SIGN=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0
        }
        $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
        [IO.File]::WriteAllBytes("${{ runner.temp }}\cine.pfx", $bytes)
        echo "SKIP_SIGN=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # ── Build WiX Installers ───────────────────────────
    - name: Build MSI
      run: |
        cd installer
        wix harvest ..\publish\win-${{ matrix.arch }} `
          -o CineMsi\Package.wxs `
          -ag "-src:..\publish\win-${{ matrix.arch }}" `
          -culture en-US

    - name: Build CineSetup.exe (Bootstrapper)
      run: |
        cd installer
        wix build CineBootstrapper\CineBootstrapper.wixproj `
          -configuration ${{ env.CONFIG }}

    - name: Sign Installer
      if: env.SKIP_SIGN != 'true'
      run: |
        & "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" sign /fd SHA256 `
          /f "${{ runner.temp }}\cine.pfx" `
          /p "${{ secrets.PFX_PASSWORD }}" `
          /tr http://timestamp.digicert.com `
          /td SHA256 `
          installer/CineBootstrapper/bin/${{ env.CONFIG }}/CineSetup.exe

        & "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" sign /fd SHA256 `
          /f "${{ runner.temp }}\cine.pfx" `
          /p "${{ secrets.PFX_PASSWORD }}" `
          /tr http://timestamp.digicert.com `
          /td SHA256 `
          installer/CineMsi/bin/${{ env.CONFIG }}/Cine.msi

    # ── MSIX Package ───────────────────────────────────
    - name: Generate .appinstaller
      run: |
        $version = '${{ steps.version.outputs.VERSION }}'
        $xml = @"
        <?xml version="1.0" encoding="utf-8"?>
        <AppInstaller
            xmlns="http://schemas.microsoft.com/appx/appinstaller/2021"
            Version="$version"
            Uri="https://github.com/${{ github.repository }}/releases/latest/download/Cine.appinstaller">
            <MainPackage
                Name="${{ env.MSIX_NAME }}"
                Publisher="CN=CineApp"
                Version="$version"
                ProcessorArchitecture="${{ matrix.arch }}"
                Uri="https://github.com/${{ github.repository }}/releases/latest/download/Cine_$($version)_${{ matrix.arch }}.msix" />
            <UpdateSettings>
                <OnLaunch HoursBetweenUpdateChecks="12" ShowPrompt="false" UpdateBlocksActivation="false" />
            </UpdateSettings>
            <ForceUpdateFromAnyVersion>true</ForceUpdateFromAnyVersion>
        </AppInstaller>
        "@
        New-Item -Type Directory -Force dist | Out-Null
        [IO.File]::WriteAllText("dist\Cine.appinstaller", $xml)

    - name: Sign MSIX
      if: env.SKIP_SIGN != 'true'
      run: |
        & "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" sign /fd SHA256 `
          /f "${{ runner.temp }}\cine.pfx" `
          /p "${{ secrets.PFX_PASSWORD }}" `
          /tr http://timestamp.digicert.com `
          /td SHA256 `
          dist\Cine_*.msix

    # ── Collect artifacts ─────────────────────────────
    - name: Gather outputs
      run: |
        New-Item -Type Directory -Force dist | Out-Null
        Copy-Item "installer/CineBootstrapper/bin/${{ env.CONFIG }}/CineSetup.exe" "dist/" -ErrorAction SilentlyContinue
        Copy-Item "installer/CineMsi/bin/${{ env.CONFIG }}/Cine.msi" "dist/" -ErrorAction SilentlyContinue

    - name: List artifacts
      run: Get-ChildItem -Recurse dist | Select-Object Name, Length

    # ── GitHub Release ─────────────────────────────────
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/CineSetup.exe
          dist/Cine.msi
          dist/Cine_*.msix
          dist/Cine.appinstaller
        body: |
          ## Cine ${{ steps.version.outputs.VERSION }}

          ### 📥 Downloads

          | Package | Description |
          |---------|-------------|
          | **CineSetup.exe** | ✅ **Recommended** — Wizard installer with auto .NET download + first-launch setup |
          | Cine.msi | Standalone MSI (requires .NET 10 Desktop Runtime pre-installed) |
          | Cine.msix | Store package with silent auto-updates |

          ### 🔧 CineSetup.exe Installation Flow
          1. **Welcome** — System requirements check
          2. **License** — Review and accept
          3. **Options** — Choose install location, shortcuts, file associations
          4. **Download** (if needed) — .NET 10 Runtime progress bar
          5. **Install** — Files deployed to Program Files
          6. **Finish** — Launch Cine checkbox + first-launch setup

          ### ✨ What's New
          See [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'preview') || contains(steps.version.outputs.VERSION, 'rc') }}
