name: Release — MSIX Package & Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  SOLUTION: Cine.sln
  APP_PROJECT: src/App/App.csproj
  TEST_PROJECT: tests/Cine.Tests/Cine.Tests.csproj
  DOTNET_VERSION: '10.0.x'
  MSIX_NAME: Cine.CineMediaPlayer

jobs:
  build-and-release:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ── Setup ──────────────────────────────────────────
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ── Restore & Build ────────────────────────────────
    - name: Restore
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Build
      run: >
        dotnet build ${{ env.SOLUTION }}
        --configuration Release
        --no-restore
        -p:Platform=${{ matrix.arch }}

    # ── Test ───────────────────────────────────────────
    - name: Test
      run: >
        dotnet test ${{ env.TEST_PROJECT }}
        --configuration Release
        --no-build
        --logger "trx;LogFileName=test-results-${{ matrix.arch }}.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.arch }}
        path: '**/*.trx'

    # ── Extract version from tag ───────────────────────
    - name: Set version
      id: version
      run: |
        $tag = '${{ github.ref_name }}' -replace '^v', ''
        echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    # ── Publish (framework-dependent) ──────────────────
    - name: Publish
      run: >
        dotnet publish ${{ env.APP_PROJECT }}
        --configuration Release
        --runtime win-${{ matrix.arch }}
        --no-build
        -p:PublishSingleFile=false
        -p:SelfContained=false
        -p:WindowsPackageType=None
        -o publish/win-${{ matrix.arch }}

    # ── Import signing certificate ─────────────────────
    - name: Import signing cert
      env:
        PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
        PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      run: |
        if (-not $env:PFX_BASE64) {
          Write-Host "No signing cert secret found — skipping MSIX creation"
          echo "SKIP_MSIX=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0
        }
        $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
        [IO.File]::WriteAllBytes("${{ runner.temp }}\cine.pfx", $bytes)
        echo "SKIP_MSIX=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # ── Generate .appinstaller ─────────────────────────
    - name: Generate .appinstaller
      if: env.SKIP_MSIX != 'true'
      run: |
        $version = '${{ steps.version.outputs.VERSION }}'
        $xml = @"
        <?xml version="1.0" encoding="utf-8"?>
        <AppInstaller
            xmlns="http://schemas.microsoft.com/appx/appinstaller/2021"
            Version="$version"
            Uri="https://github.com/${{ github.repository }}/releases/latest/download/Cine.appinstaller">

            <MainPackage
                Name="${{ env.MSIX_NAME }}"
                Publisher="CN=CineApp"
                Version="$version"
                ProcessorArchitecture="${{ matrix.arch }}"
                Uri="https://github.com/${{ github.repository }}/releases/latest/download/Cine_$($version)_${{ matrix.arch }}.msix" />

            <UpdateSettings>
                <OnLaunch
                    HoursBetweenUpdateChecks="12"
                    ShowPrompt="false"
                    UpdateBlocksActivation="false" />
            </UpdateSettings>

            <ForceUpdateFromAnyVersion>true</ForceUpdateFromAnyVersion>
        </AppInstaller>
        "@
        [IO.File]::WriteAllText("dist\Cine.appinstaller", $xml)

    # ── Create MSIX with MakeAppx ──────────────────────
    - name: Create MSIX
      if: env.SKIP_MSIX != 'true'
      shell: pwsh
      run: |
        $makeappx = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.20348.0\x64\MakeAppx.exe"
        if (-not (Test-Path $makeappx)) {
          # Try to find latest Windows SDK
          $kitsDir = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $latest = Get-ChildItem $kitsDir -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $makeappx = Join-Path $latest.FullName "x64\MakeAppx.exe"
        }

        if (-not (Test-Path $makeappx)) {
          Write-Warning "MakeAppx.exe not found — skipping MSIX creation. Install Windows SDK."
          exit 0
        }

        # Create mapping file
        $mapping = @"
        [Files]
        "publish\win-${{ matrix.arch }}\Cine.Avalonia.exe" "Cine.Avalonia.exe"
        "publish\win-${{ matrix.arch }}\*.dll" "*.dll"
        "publish\win-${{ matrix.arch }}\*.json" "*.json"
        "@
        [IO.File]::WriteAllText("dist\mapping.txt", $mapping)

        $outFile = "dist\Cine_${{ steps.version.outputs.VERSION }}_${{ matrix.arch }}.msix"
        & $makeappx pack /m src\App\Package.appxmanifest /f dist\mapping.txt /p $outFile /o
        Write-Host "MSIX created: $outFile"

    # ── Sign MSIX ──────────────────────────────────────
    - name: Sign MSIX
      if: env.SKIP_MSIX != 'true'
      run: |
        & "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" sign /fd SHA256 `
          /f "${{ runner.temp }}\cine.pfx" `
          /p "${{ secrets.PFX_PASSWORD }}" `
          /tr http://timestamp.digicert.com `
          /td SHA256 `
          dist\Cine_*.msix

    # ── GitHub Release ─────────────────────────────────
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Cine_*.msix
          dist/Cine.appinstaller
        body: |
          ## Cine ${{ steps.version.outputs.VERSION }}

          ### Install
          1. Download `Cine_${{ steps.version.outputs.VERSION }}_x64.msix`
          2. Double-click to install
          3. Windows will download .NET 10 Runtime automatically if needed

          ### Auto-update
          Run the `.appinstaller` file once and Cine will auto-update silently.

          ---
          **SHA256 checksums** (verify integrity):
          ```
          $(Get-FileHash dist\*.msix -Algorithm SHA256 | ForEach-Object { "$($_.Hash) $($_.Name)" })
          ```
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'preview') || contains(steps.version.outputs.VERSION, 'rc') }}
