<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simba — Play Anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   CSS Variables
   ============================================ */
:root {
    /* Backgrounds */
    --bg-deepest: #08080A;
    --bg-deep:   #0C0C0E;
    --bg-base:   #0F0F12;

    /* Glass materials */
    --glass-bg:          rgba(255, 255, 255, 0.02);
    --glass-border:      rgba(255, 255, 255, 0.05);
    --glass-highlight:   rgba(255, 255, 255, 0.04);
    --glass-shadow:      0 16px 48px -12px rgba(0, 0, 0, 0.6);
    --glass-blur:        24px;

    /* Card glass (slightly more visible) */
    --card-glass-bg:     rgba(255, 255, 255, 0.025);
    --card-glass-border: rgba(255, 255, 255, 0.06);
    --card-shadow:       0 8px 24px -8px rgba(0, 0, 0, 0.5);

    /* Accent — Warm Bronze */
    --accent:       #C9A96E;
    --accent-dim:   rgba(201, 169, 110, 0.12);
    --accent-border:rgba(201, 169, 110, 0.2);
    --accent-glow:  rgba(201, 169, 110, 0.08);

    /* Text */
    --text-primary:    #F0F0F2;
    --text-secondary:  rgba(240, 240, 242, 0.55);
    --text-tertiary:   rgba(240, 240, 242, 0.3);

    /* Spacing */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --space-2xl: 48px;
    --space-3xl: 64px;

    /* Radii */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    /* Transitions */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --duration-fast: 200ms;
    --duration-normal: 400ms;
    --duration-slow: 800ms;

    /* Font stacks */
    --font-display: 'Outfit', sans-serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ============================================
   Reset
   ============================================ */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body — remove overflow clip so recent cards don't get cut during animation */
html, body {
    height: 100%;
}

body {
    font-family: var(--font-ui);
    background: var(--bg-deepest);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ============================================
   Background
   ============================================ */
.bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
        radial-gradient(ellipse 85% 60% at 50% 40%, rgba(201, 169, 110, 0.04) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 70% 80%, rgba(255, 255, 255, 0.015) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 60%, rgba(201, 169, 110, 0.025) 0%, transparent 50%),
        linear-gradient(170deg, var(--bg-deepest) 0%, var(--bg-deep) 50%, var(--bg-base) 100%);
}

/* Subtle noise overlay */
.bg::after {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 200px 200px;
    pointer-events: none;
}

/* Soft vignette */
.bg::before {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 150px 60px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    z-index: 1;
}

/* Ambient glow orb */
.glow-orb {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    top: 20%;
    right: -10%;
    pointer-events: none;
    z-index: 0;
    animation: orbFloat 12s var(--ease-in-out) infinite alternate;
}

@keyframes orbFloat {
    0%   { transform: translate(0, 0) scale(1); opacity: 0.6; }
    50%  { transform: translate(-30px, 20px) scale(1.05); opacity: 0.8; }
    100% { transform: translate(-10px, -10px) scale(0.95); opacity: 0.5; }
}

/* ============================================
   App Container
   ============================================ */
.app {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
    overflow-y: auto;
    opacity: 0;
    animation: appFadeIn 500ms var(--ease-out) 100ms forwards;
}

@keyframes appFadeIn {
    to { opacity: 1; }
}

/* ============================================
   Layout Grid
   ============================================ */
.layout {
    display: grid;
    grid-template-columns: 1fr minmax(auto, 480px) 1fr;
    grid-template-rows: auto 1fr auto;
    gap: var(--space-xl);
    width: 100%;
    max-width: 1400px;
    height: 100%;
    max-height: 900px;
}

/* ============================================
   Brand (Top-Left Anchored)
   ============================================ */
.brand {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
    align-self: start;
    padding-top: var(--space-lg);
    opacity: 0;
    transform: translateY(-8px);
    animation: fadeSlideIn 500ms var(--ease-out) 250ms forwards;
}

@keyframes fadeSlideIn {
    to { opacity: 1; transform: translateY(0); }
}

.brand-logo-wrapper {
    margin-bottom: var(--space-md);
    opacity: 0;
    transform: translateY(-4px);
    animation: fadeSlideIn 500ms var(--ease-out) 150ms forwards;
}

.brand-logo {
    width: 100px;
    height: 100px;
    color: var(--accent);
    display: block;
}

.brand-wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 3.5vw, 52px);
    letter-spacing: 0.08em;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: var(--space-sm);
}

.brand-tagline {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(14px, 1.2vw, 18px);
    letter-spacing: 0.02em;
    color: var(--text-secondary);
}

/* ============================================
   Main Glass Panel (Center-Right)
   ============================================ */
.main-panel {
    grid-column: 2 / 4;
    grid-row: 1 / 3;
    align-self: center;
    justify-self: center;
    width: 100%;
    max-width: 500px;
    padding: clamp(28px, 3vw, 40px);
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 0.5px solid var(--glass-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--glass-shadow), inset 0 0.5px 0 var(--glass-highlight);
    opacity: 0;
    transform: translateY(12px);
    animation: panelMaterialize 600ms var(--ease-out) 180ms forwards;
}

@keyframes panelMaterialize {
    to { opacity: 1; transform: translateY(0); }
}

/* Subtle hover parallax on panel */
.main-panel:hover {
    box-shadow:
        var(--glass-shadow),
        inset 0 0.5px 0 var(--glass-highlight),
        0 0 0 0.5px var(--accent-border);
}

.main-panel-inner {
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
}

/* Panel label */
.panel-label {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
}

/* Drop zone */
.drop-zone {
    position: relative;
    border: 0.5px dashed rgba(255, 255, 255, 0.08);
    border-radius: var(--radius-lg);
    padding: clamp(20px, 3vh, 36px) clamp(16px, 2vw, 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-md);
    text-align: center;
    transition: border-color var(--duration-fast) var(--ease-out),
                background var(--duration-fast) var(--ease-out);
}

.drop-zone:hover,
.drop-zone.drag-over {
    border-color: var(--accent-border);
    background: var(--accent-dim);
}

.drop-zone-icon {
    width: 32px;
    height: 32px;
    color: var(--text-tertiary);
    transition: color var(--duration-fast) var(--ease-out);
}

.drop-zone:hover .drop-zone-icon,
.drop-zone.drag-over .drop-zone-icon {
    color: var(--accent);
}

.drop-zone-text {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.5;
}

.drop-zone-hint {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 2px;
}

/* Actions row */
.actions {
    display: flex;
    gap: var(--space-sm);
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
    outline: none;
    position: relative;
    overflow: hidden;
}

.btn:focus-visible {
    box-shadow: 0 0 0 2px var(--accent);
}

/* Primary */
.btn-primary {
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    color: var(--text-primary);
    flex: 1;
}

.btn-primary:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.4);
    transform: translateY(-1px);
}

.btn-primary:active {
    transform: translateY(0);
    box-shadow: none;
}

/* Secondary */
.btn-secondary {
    background: transparent;
    border: 0.5px solid var(--glass-border);
    color: var(--text-secondary);
}

.btn-secondary:hover {
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.03);
    transform: translateY(-1px);
}

.btn-secondary:active {
    transform: translateY(0);
}

.btn-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    opacity: 0.7;
    transition: opacity var(--duration-fast) var(--ease-out);
}

.btn:hover .btn-icon {
    opacity: 1;
}

/* ============================================
   Recent Media Section
   ============================================ */
.recent-section {
    grid-column: 1 / -1;
    grid-row: 3 / 4;
    align-self: end;
    padding-bottom: var(--space-lg);
    opacity: 0;
    animation: fadeSlideIn 500ms var(--ease-out) 450ms forwards;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.recent-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-md);
    flex-shrink: 0;
}

.recent-label {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
}

.recent-count {
    font-size: 11px;
    color: var(--text-tertiary);
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    border-radius: 100px;
    padding: 2px 10px;
}

.recent-track {
    display: flex;
    gap: var(--space-sm);
    overflow-x: auto;
    padding-top: 20px;
    padding-bottom: var(--space-sm);
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex-shrink: 0;
}

.recent-track::-webkit-scrollbar {
    display: none;
}

/* Recent Media Card */
.media-card {
    flex-shrink: 0;
    width: 180px;
    padding: var(--space-md);
    background: var(--card-glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 0.5px solid var(--card-glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--card-shadow), inset 0 0.5px 0 var(--glass-highlight);
    cursor: pointer;
    transition: all var(--duration-normal) var(--ease-out);
    opacity: 0;
    transform: translateY(8px);
    user-select: none;
}

.media-card.show {
    opacity: 1;
    transform: translateY(0);
}

.media-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent-border);
    box-shadow:
        0 16px 32px -12px rgba(0, 0, 0, 0.6),
        inset 0 0.5px 0 var(--glass-highlight);
    background: rgba(255, 255, 255, 0.035);
}

.media-card-thumb {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: var(--radius-sm);
    margin-bottom: var(--space-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--duration-normal) var(--ease-out);
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
}

.media-card:hover .media-card-thumb {
    transform: scale(1.02);
}

/* Blurred cover image — fills the thumb, blurred */
.media-card-thumb-img {
    position: absolute;
    inset: -8px;
    width: calc(100% + 16px);
    height: calc(100% + 16px);
    object-fit: cover;
    filter: blur(16px) saturate(1.2);
    opacity: 0.9;
    pointer-events: none;
}

/* Dark overlay to keep icon legible */
.media-card-thumb-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: rgba(0, 0, 0, 0.1);
}

.media-card-thumb-icon {
    position: relative;
    z-index: 2;
    width: 24px;
    height: 24px;
    opacity: 0.65;
    transition: opacity var(--duration-fast) var(--ease-out);
    color: #fff;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
}

.media-card:hover .media-card-thumb-icon {
    opacity: 0.9;
}

.media-card-title {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
}

.media-card-meta {
    font-size: 10px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: var(--space-sm);
}

.media-card-meta span {
    white-space: nowrap;
}

.media-card-dot {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--text-tertiary);
}

/* ============================================
   Keyboard Hint
   ============================================ */
.kbd-hint {
    position: fixed;
    bottom: var(--space-lg);
    right: var(--space-lg);
    z-index: 2;
    font-family: var(--font-ui);
    font-size: 11px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    opacity: 0;
    animation: fadeIn 500ms var(--ease-out) 900ms forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 20px;
    padding: 0 6px;
    font-family: var(--font-ui);
    font-size: 10px;
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    border-radius: 4px;
    color: var(--text-secondary);
}

/* ============================================
   Drag Over State (global)
   ============================================ */
body.global-drag-over .drop-zone {
    border-color: var(--accent-border);
    background: var(--accent-dim);
}

body.global-drag-over .drop-zone-icon {
    color: var(--accent);
}

/* ============================================
   Empty State (no recent media)
   ============================================ */
.empty-state {
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    padding: var(--space-lg) 0;
}

/* ============================================
   Reduced Motion
   ============================================ */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }

    .glow-orb {
        display: none;
    }
}

/* ============================================
   Responsive — Laptop (1024–1200px)
   ============================================ */
@media (max-width: 1200px) {
    .layout {
        max-width: 1000px;
        gap: var(--space-lg);
    }

    .main-panel {
        max-width: 420px;
    }

    .media-card {
        width: 160px;
    }
}

/* ============================================
   Responsive — Tablet (768–1024px)
   ============================================ */
@media (max-width: 1024px) {
    .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto;
        max-height: none;
        gap: var(--space-lg);
        padding: var(--space-lg);
    }

    .brand {
        grid-column: 1;
        grid-row: 1;
        text-align: center;
        padding-top: 0;
    }

    .main-panel {
        grid-column: 1;
        grid-row: 2;
        max-width: 460px;
        justify-self: center;
    }

    .recent-section {
        grid-column: 1;
        grid-row: 3;
        padding-bottom: 0;
    }

    .app {
        overflow-y: auto;
        justify-content: flex-start;
        padding-top: var(--space-2xl);
    }

    .glow-orb {
        width: 300px;
        height: 300px;
    }

    .kbd-hint {
        display: none;
    }
}

/* ============================================
   Responsive — Mobile (<768px)
   ============================================ */
@media (max-width: 768px) {
    .app {
        padding: var(--space-md);
        padding-top: var(--space-xl);
    }

    .layout {
        padding: 0;
        gap: var(--space-md);
    }

    .brand-wordmark {
        font-size: 24px;
    }

    .brand-tagline {
        font-size: 13px;
    }

    .main-panel {
        padding: var(--space-lg);
        max-width: 100%;
        border-radius: var(--radius-lg);
    }

    .drop-zone {
        padding: var(--space-lg) var(--space-md);
    }

    .actions {
        flex-direction: column;
    }

    .btn {
        padding: 12px 20px;
        font-size: 13px;
    }

    .media-card {
        width: 140px;
        padding: var(--space-sm);
    }

    .recent-header {
        margin-bottom: var(--space-sm);
    }

    .recent-track {
        gap: var(--space-xs);
    }

    .glow-orb {
        width: 200px;
        height: 200px;
        top: auto;
        bottom: 0;
        right: 0;
    }

    .kbd-hint {
        display: none;
    }
}

/* ============================================
   Responsive — Large Desktop (1600px+)
   ============================================ */
@media (min-width: 1600px) {
    .layout {
        max-width: 1600px;
        gap: var(--space-2xl);
    }

    .main-panel {
        max-width: 560px;
        padding: clamp(36px, 3vw, 48px);
    }

    .media-card {
        width: 200px;
    }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg" aria-hidden="true"></div>
<div class="glow-orb" aria-hidden="true"></div>

<!-- App -->
<div class="app" role="main">

    <div class="layout">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-logo-wrapper">

<script>
/* ============================================
   Simba — Startup Page
   ============================================ */

// --- State ---
const state = {
    recentMedia: []
};

// --- DOM refs ---
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const folderInput = document.getElementById('folderInput');
const openMediaBtn = document.getElementById('openMediaBtn');
const openFolderBtn = document.getElementById('openFolderBtn');
const recentTrack = document.getElementById('recentTrack');
const recentCount = document.getElementById('recentCount');

// --- Recent Media Storage ---
function loadRecent() {
    try {
        const saved = localStorage.getItem('simba_recent');
        state.recentMedia = saved ? JSON.parse(saved) : [];
    } catch {
        state.recentMedia = [];
    }
    // Seed demo data if empty
    if (state.recentMedia.length === 0) {
        state.recentMedia = getDemoMedia();
        saveRecent();
    }
    renderRecent();
}

function saveRecent() {
    try {
        localStorage.setItem('simba_recent', JSON.stringify(state.recentMedia.slice(0, 20)));
    } catch { /* storage full */ }
}

function addRecent(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    const videoExt = ['mp4','mkv','mov','avi','wmv','m4v','webm'];
    const audioExt = ['mp3','flac','wav','aac','ogg','m4a','wma'];
    const type = videoExt.includes(ext) ? 'video' : audioExt.includes(ext) ? 'audio' : 'video';
    state.recentMedia.unshift({
        id: Date.now() + Math.random(),
        title: file.name,
        type: type,
        duration: '—',
        size: formatSize(file.size),
        lastOpened: 'Just now',
        path: file.name
    });
    saveRecent();
    renderRecent();
}

function getDemoMedia() {
    return [

function formatSize(bytes) {
    if (!bytes) return '—';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function formatDuration(seconds) {
    if (!seconds) return '—';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (h > 0) return h + 'h ' + m + 'm';
    return m + 'm';
}

// --- Render Recent Media ---
function renderRecent() {
    recentTrack.innerHTML = '';
    recentCount.textContent = state.recentMedia.length;

    state.recentMedia.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.style.transitionDelay = (i * 50) + 'ms';

        const isVideo = item.type === 'video';

        card.innerHTML = `
            <div class="media-card-thumb">
                <img class="media-card-thumb-img" src="${item.cover || ''}" alt="" loading="lazy" onerror="this.style.display='none'">
                <div class="media-card-thumb-overlay"></div>
                <svg class="media-card-thumb-icon" viewBox="0 0 24 24" fill="currentColor">
                    ${isVideo
                        ? '<path d="M8 5v14l11-7z"/>'
                        : '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>'
                    }
                </svg>
            </div>
            <div class="media-card-title">${item.title}</div>
            <div class="media-card-meta">
                <span>${item.duration}</span>
                <span class="media-card-dot"></span>
                <span>${item.lastOpened}</span>
            </div>
        `;

        // Stagger animation
        const delay = 600 + (i * 60);
        setTimeout(() => card.classList.add('show'), delay);

        recentTrack.appendChild(card);
    });
}

// --- File handling ---
function handleFiles(files) {
    for (const file of files) {
        addRecent(file);
    }
}

// --- Button events ---
openMediaBtn.addEventListener('click', () => fileInput.click());
openFolderBtn.addEventListener('click', () => folderInput.click());

fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
    e.target.value = '';
});

folderInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
    e.target.value = '';
});

// --- Drag & Drop ---
let dragCounter = 0;

document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    document.body.classList.add('global-drag-over');
    dropZone.classList.add('drag-over');
});

document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
        dragCounter = 0;
        document.body.classList.remove('global-drag-over');
        dropZone.classList.remove('drag-over');
    }
});

document.addEventListener('dragover', (e) => {
    e.preventDefault();
});

document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    document.body.classList.remove('global-drag-over');
    dropZone.classList.remove('drag-over');

    if (e.dataTransfer.files.length) {
        handleFiles(e.dataTransfer.files);
    }
});

// --- Keyboard shortcuts ---
document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
        e.preventDefault();
        fileInput.click();
    }
});

// --- Init ---
document.addEventListener('DOMContentLoaded', () => {
    loadRecent();
});
</script>
